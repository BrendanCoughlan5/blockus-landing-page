<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blockus — Coming Soon</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #05060f;
      --surface: #0d0f1e;
      --accent: #3b6ff5;
      --accent-glow: rgba(59, 111, 245, 0.35);
      --text: #f0f2ff;
      --muted: #6b7094;
      --border: rgba(255, 255, 255, 0.07);
    }

    html, body {
      height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Subtle radial glow behind the logo */
    body::before {
      content: "";
      position: fixed;
      top: 30%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    main {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      text-align: center;
      padding: 2rem;
    }

    /* ── Logo ── */
    .logo-wrap {
      margin-bottom: 2.5rem;
    }

    .logo-svg {
      width: 96px;
      height: 96px;
      filter: drop-shadow(0 0 24px rgba(59, 111, 245, 0.55));
    }

    /* ── Wordmark ── */
    .wordmark {
      font-size: clamp(2rem, 6vw, 3.5rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1;
      background: linear-gradient(135deg, #ffffff 30%, #7fa8ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 1.25rem;
    }

    /* ── Coming Soon badge ── */
    .badge {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
      border: 1px solid rgba(59, 111, 245, 0.4);
      background: rgba(59, 111, 245, 0.08);
      padding: 0.4em 1em;
      border-radius: 99px;
      margin-bottom: 1.5rem;
    }

    /* ── Tagline ── */
    .tagline {
      font-size: clamp(0.95rem, 2.5vw, 1.15rem);
      color: var(--muted);
      max-width: 380px;
      line-height: 1.6;
      margin-bottom: 3rem;
    }

    /* ── Divider ── */
    .divider {
      width: 40px;
      height: 2px;
      background: linear-gradient(90deg, var(--accent), transparent);
      border-radius: 2px;
      margin-bottom: 3rem;
    }

    /* ── Social links ── */
    .socials {
      display: flex;
      gap: 1rem;
    }

    .social-btn {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      padding: 0.65rem 1.25rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 500;
      transition: border-color 0.2s, background 0.2s, transform 0.15s;
    }

    .social-btn:hover {
      border-color: rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.06);
      transform: translateY(-2px);
    }

    .social-btn svg {
      flex-shrink: 0;
    }

    /* ── Footer ── */
    footer {
      position: fixed;
      bottom: 1.5rem;
      width: 100%;
      text-align: center;
      font-size: 0.75rem;
      color: var(--muted);
      z-index: 1;
    }
  </style>
</head>
<body>

<main>

  <!-- Logo -->
  <div class="logo-wrap">
    <svg class="logo-svg" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Blockus logo">
      <circle cx="48" cy="48" r="48" fill="#1a2ff0"/>
      <!-- Isometric block / B mark -->
      <!-- Left face -->
      <polygon points="48,24 24,38 24,58 48,44" fill="#4a6fff" opacity="0.95"/>
      <!-- Right face -->
      <polygon points="48,24 72,38 72,58 48,44" fill="#1a2ff0"/>
      <!-- Top face -->
      <polygon points="24,38 48,24 72,38 48,52" fill="#7aa0ff"/>
    </svg>
  </div>

  <!-- Wordmark -->
  <h1 class="wordmark">Blockus</h1>

  <!-- Badge -->
  <span class="badge">Coming Soon</span>

  <!-- Tagline -->
  <p class="tagline">Powering next-gen Web3 games. Building the infrastructure layer for the future of gaming.</p>

  <div class="divider"></div>

  <!-- Social links -->
  <div class="socials">
    <!-- X / Twitter -->
    <a class="social-btn" href="https://x.com/BlockusGG" target="_blank" rel="noopener noreferrer">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.744l7.737-8.835L1.254 2.25H8.08l4.253 5.622L18.244 2.25zm-1.161 17.52h1.833L7.084 4.126H5.117L17.083 19.77z"/>
      </svg>
      Follow on X
    </a>

    <!-- LinkedIn -->
    <a class="social-btn" href="https://www.linkedin.com/company/blockusgg" target="_blank" rel="noopener noreferrer">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
      </svg>
      LinkedIn
    </a>
  </div>

</main>

<footer>© 2026 Blockus · blockus.gg</footer>

</body>
</html>
